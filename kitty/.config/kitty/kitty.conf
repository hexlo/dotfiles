include ~/.local/state/omarchy/current/theme/kitty.conf

# Font (mirrors ~/dotfiles/ghostty/.config/ghostty/config)
# Ghostty used "JetBrains Mono" (Regular); kitty uses the Nerd Font variant
# since that's what's installed (fc-list has no plain "JetBrains Mono").
font_family      JetBrainsMono Nerd Font
bold_italic_font auto
font_size        12.0

# Window
window_padding_width    14
hide_window_decorations yes
confirm_os_window_close 0
# Ghostty's `resize-overlay = never` has no kitty equivalent (kitty doesn't
# show a resize overlay by default, so no setting needed).

# Background (mirrors ghostty's background/background-image settings)
background              #000000
background_opacity      1.0
background_image        ~/dotfiles/ghostty/.config/ghostty/hexlo-nightsky3.jpg
# background_tint blends `background` (black) over the image: 0 = full
# image, 1 = fully black. Raised from 0 to 0.6 so foreground text stays
# readable against the image.
background_tint         0.9
# cscaled = centered + scaled to fill, closest kitty equivalent to
# ghostty's position=center + fit=cover
background_image_layout cscaled

# Keybindings
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
map f11 toggle_fullscreen
# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u
# Kitty legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u

# NOTE: ghostty's global keybinds (super+grave_accent / ctrl+` to toggle a
# quake-style quick terminal) have no kitty app-level equivalent — kitty
# can't bind hotkeys while unfocused. If you want that behavior back,
# bind a quick-terminal toggle in Hyprland instead (e.g. a scratchpad rule).

# Allow remote access
allow_remote_control yes
listen_on unix:${XDG_RUNTIME_DIR}/omarchy-kitty-{kitty_pid}

# Aesthetics
cursor_shape             block
cursor_blink_interval    0
shell_integration        no-cursor
enable_audio_bell        no

# Minimal Tab bar styling
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   slanted
tab_title_template    {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
